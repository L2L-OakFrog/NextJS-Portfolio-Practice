<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Will you go on a date with me?</title><style>@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Nunito:wght@600;700;800;900&display=swap');*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Nunito,system-ui;color:#553545;background:#ffe7f2}body{overflow-x:hidden;background:radial-gradient(circle at 18% 10%,#fff 0 16%,#ffeef7 36%,#f8cfe1 70%,#fff5fb 100%)}.wrap{min-height:100svh;display:grid;place-items:center;padding:18px 12px 28px;position:relative}.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}.orb{position:absolute;border-radius:999px;filter:blur(18px);opacity:.55;animation:drift 9s ease-in-out infinite}.o1{width:230px;height:230px;background:#ff9fc4;left:-80px;top:80px}.o2{width:180px;height:180px;background:#fff;right:-55px;bottom:70px;animation-delay:-3s}.o3{width:120px;height:120px;background:#ffd0e3;right:30px;top:65px;animation-delay:-5s}@keyframes drift{50%{transform:translateY(24px) scale(1.08)}}.heart{position:absolute;bottom:-30px;font-size:18px;opacity:.48;animation:rise linear infinite}.heart:nth-child(4){left:10%;animation-duration:8s}.heart:nth-child(5){left:28%;animation-duration:10s;animation-delay:-4s}.heart:nth-child(6){left:52%;animation-duration:9s;animation-delay:-2s}.heart:nth-child(7){left:76%;animation-duration:11s;animation-delay:-6s}@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}#app{width:min(100%,430px)}.card{width:100%;position:relative;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.9);border-radius:34px;padding:30px;box-shadow:0 28px 70px rgba(171,58,107,.23);backdrop-filter:blur(18px);overflow:hidden;animation:pop .42s cubic-bezier(.2,.9,.2,1)}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.75),transparent 48%);pointer-events:none}.card>*{position:relative}@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}h1,h2{font-family:'Playfair Display',serif;color:#bd4f7c;text-align:center;line-height:1.08;margin:0 0 18px}h1{font-size:38px}h2{font-size:33px}.pill{width:max-content;margin:0 auto 16px;background:#fff2f8;border:1px solid #ffdce9;color:#b84b78;border-radius:999px;padding:8px 13px;font-weight:900;font-size:13px}.sub{text-align:center;color:#8b6979;margin:0 0 22px}.gif{width:150px;height:116px;margin:2px auto 20px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(135deg,#fff5fa,#ffd7e8);font-size:54px;box-shadow:inset 0 0 0 1px #fff}.btn{border:0;width:100%;height:58px;border-radius:999px;background:linear-gradient(90deg,#cf2e73,#ef6aa1);color:#fff;font-size:17px;font-weight:1000;letter-spacing:.2px;box-shadow:0 16px 30px rgba(210,55,119,.28);cursor:pointer;transition:.18s}.btn:active{transform:scale(.98)}.btn:disabled{background:#eee;color:#aaa;box-shadow:none}.no{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);border:1px solid #ffd7e6;background:#fff3f8;color:#9a6378;border-radius:999px;padding:11px 25px;font-weight:900;transition:.25s cubic-bezier(.2,.9,.2,1)}.ask{padding-bottom:92px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.label{font-weight:1000;margin:16px 0 10px}.calendar{background:rgba(255,255,255,.68);border:1px solid #efd7e2;border-radius:24px;padding:15px}.nav{border:0;background:#fff3f8;border-radius:14px;width:38px;height:36px;font-size:24px;color:#9e5774}.month{font-weight:1000;font-size:19px;color:#705364}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}.week{gap:4px;margin:16px 0 7px;color:#9d8b94;font-size:13px;font-weight:1000}.grid{gap:5px}.day{height:36px;border:0;border-radius:999px;background:transparent;color:#5f4a55;font-size:15px;font-weight:900}.blank{opacity:0;pointer-events:none}.picked,.choice.picked{background:linear-gradient(90deg,#cf2e73,#ef6aa1)!important;color:#fff!important;box-shadow:0 10px 18px rgba(207,46,115,.23)}.times{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{border:1px solid #efd7e2;background:rgba(255,255,255,.82);height:50px;border-radius:999px;color:#553545;font-weight:1000;font-size:15px}.food{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.food .choice{height:105px;border-radius:24px}.emoji{display:block;font-size:34px;margin-bottom:5px}.summary{border:1px solid #efd7e2;background:#fff5fa;border-radius:24px;padding:17px;text-align:center;margin:18px 0}.summary b{display:block;color:#bd4f7c;font-size:18px;margin-bottom:7px}.confetti{position:fixed;top:-14px;font-size:18px;animation:fall 1.8s ease-in forwards;z-index:20}@keyframes fall{to{transform:translateY(110vh) rotate(520deg);opacity:0}}@media(max-width:390px){.wrap{padding:12px 9px 22px}.card{padding:23px;border-radius:28px}h1{font-size:32px}h2{font-size:28px}.gif{width:130px;height:96px;font-size:46px}.calendar{padding:12px;border-radius:22px}.grid{gap:3px}.day{height:32px;font-size:14px}.choice{height:47px;font-size:14px}.food .choice{height:92px}.emoji{font-size:30px}.btn{height:55px}.ask{padding-bottom:86px}}@media(max-width:340px){.card{padding:19px}h1{font-size:29px}h2{font-size:25px}.month{font-size:17px}.day{height:29px}.choice{font-size:13px}}</style></head><body><div class="wrap"><div class="bg"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><span class="heart">💗</span><span class="heart">💕</span><span class="heart">💖</span><span class="heart">💘</span></div><main id="app"></main></div><script>const app=document.getElementById('app'),months=['January','February','March','April','May','June','July','August','September','October','November','December'],times=['12:00 PM','1:00 PM','2:00 PM','3:00 PM','4:00 PM','5:00 PM','6:00 PM','6:30 PM','7:00 PM','7:30 PM','8:00 PM','8:30 PM'],foods=[['🍕','Pizza'],['🍣','Sushi'],['🍔','Burgers'],['🍝','Pasta'],['🌮','Tacos'],['🍜','Ramen']];let now=new Date(),step='ask',m=now.getMonth(),y=now.getFullYear(),d=null,t='',f='',no={x:0,y:0};const dim=(y,m)=>new Date(y,m+1,0).getDate(),first=(y,m)=>new Date(y,m,1).getDay();function top(){setTimeout(()=>scrollTo({top:0,behavior:'smooth'}),20)}function render(){top();if(step==='ask')app.innerHTML=`<section class="card ask"><div class="pill">✨ one very important question</div><div class="gif">🥰</div><h1>Will you go on a date with me?</h1><p class="sub">Choose carefully... the no button is very shy.</p><button class="btn" onclick="step='date';render()">YES, obviously 💕</button><button class="no" onpointerenter="moveNo()" onclick="moveNo()" style="translate:${no.x}px ${no.y}px">NO 🙈</button></section>`;if(step==='date'){let blanks=Array(first(y,m)).fill('<button class="day blank"></button>').join(''),days=Array.from({length:dim(y,m)},(_,i)=>`<button class="day ${d==i+1?'picked':''}" onclick="d=${i+1};render()">${i+1}</button>`).join('');app.innerHTML=`<section class="card"><h2>So... when are you free? 🗓️🐾</h2><div class="label">Pick a day</div><div class="calendar"><div class="row"><button class="nav" onclick="prev()">‹</button><div class="month">${months[m]} ${y}</div><button class="nav" onclick="next()">›</button></div><div class="week">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(x=>`<span>${x}</span>`).join('')}</div><div class="grid">${blanks}${days}</div></div><div class="label">What time?</div><div class="times">${times.map(x=>`<button class="choice ${t==x?'picked':''}" onclick="t='${x}';render()">${x}</button>`).join('')}</div><button class="btn" ${!d||!t?'disabled':''} onclick="step='food';render()">Set the date ❤️</button></section>`}if(step==='food')app.innerHTML=`<section class="card"><h2>What are we eating? 🍽️</h2><p class="sub">Pick the vibe for our date.</p><div class="food">${foods.map(([e,n])=>`<button class="choice ${f==n?'picked':''}" onclick="f='${n}';render()"><span class="emoji">${e}</span>${n}</button>`).join('')}</div><button class="btn" ${!f?'disabled':''} onclick="step='done';render();party()">Confirm plan ✨</button></section>`;if(step==='done')app.innerHTML=`<section class="card"><div class="gif">💞</div><h2>It’s a date!</h2><p class="sub">I saved the plan in my heart.</p><div class="summary"><b>${months[m]} ${d}, ${y}</b><span>${t}</span><br><span>🍽️ ${f}</span></div><button class="btn" onclick="step='ask';d=null;t='';f='';render()">Start over</button></section>`}function moveNo(){let w=Math.min(innerWidth,430);no={x:(Math.random()-.5)*(w*.55),y:(Math.random()-.5)*120};render()}function next(){d=null;m==11?(m=0,y++):m++;render()}function prev(){d=null;m==0?(m=11,y--):m--;render()}function party(){['💖','💕','✨','🌸','💘','🎀','💗','⭐'].forEach((e,i)=>{let s=document.createElement('span');s.className='confetti';s.textContent=e;s.style.left=Math.random()*100+'vw';s.style.animationDelay=i*.08+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2200)})}render();</script></body></html>
