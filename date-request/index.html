<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Date Request</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;color:#4a3440;min-height:100vh;background:radial-gradient(circle at 20% 20%,#fff 0,#ffeef7 32%,#f7dbe8 62%,#fff7fb 100%);overflow:hidden}main{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative}.blob{position:absolute;border-radius:999px;filter:blur(20px);opacity:.55;animation:float 7s ease-in-out infinite}.one{width:280px;height:280px;background:#f7a8c5;left:8%;top:12%}.two{width:230px;height:230px;background:#fff;right:10%;bottom:8%;animation-delay:-3s}@keyframes float{50%{transform:translateY(25px) scale(1.05)}}.phone{width:min(100%,430px);min-height:560px;display:grid;place-items:center}.card{width:100%;background:rgba(255,255,255,.78);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.9);border-radius:28px;box-shadow:0 30px 80px rgba(169,80,118,.22);padding:38px;text-align:center;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.7),transparent 45%);pointer-events:none}.tiny{display:inline-flex;gap:8px;align-items:center;color:#b34d79;background:#fff2f7;border:1px solid #ffe0ed;padding:8px 12px;border-radius:99px;font-size:13px;margin-bottom:18px}.ask-card h1,.card h2{font-family:'Playfair Display',serif;color:#b23d68;line-height:1.15;margin:0 0 28px;font-size:36px}.yes,.next{border:0;width:100%;height:62px;border-radius:999px;background:linear-gradient(90deg,#d93078,#d64d8d);color:white;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 15px 28px rgba(214,77,141,.28);cursor:pointer;transition:.2s}.yes:hover,.next:hover{transform:translateY(-2px)}.no{position:absolute;left:70px;bottom:48px;border:0;background:#ffe7f0;color:#8b6374;padding:12px 28px;border-radius:999px;cursor:pointer;transition:transform .25s ease}.tall{text-align:left}.tall h2{text-align:center;font-size:34px}.tall label{font-size:14px;font-weight:700;margin:16px 0 10px;display:block}.calendar{border:1px solid #efdce5;border-radius:18px;padding:18px;background:rgba(255,255,255,.58)}.cal-head{display:flex;justify-content:space-between;align-items:center}.cal-head button,.grid button,.chips button,.foodgrid button{border:0;background:transparent;color:#4a3440;cursor:pointer}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.week{margin:18px 0 8px;color:#7d6872;font-size:13px}.grid button{height:34px;border-radius:50%;font-size:15px}.grid button:hover,.grid .picked,.chips .picked,.foodgrid .picked{background:#d94d8a!important;color:#fff;box-shadow:0 8px 18px rgba(217,77,138,.25)}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.chips button{background:#fff;border:1px solid #ecd9e1;padding:12px;border-radius:999px;font-weight:600}.next{margin-top:26px}.next:disabled{background:#eee;color:#aaa;box-shadow:none;cursor:not-allowed}.foodgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.foodgrid button{height:108px;border:1px solid #eedce5;border-radius:20px;background:rgba(255,255,255,.56);font-weight:700;color:#7c6670}.foodgrid span{display:block;font-size:30px;margin-bottom:8px}.done-card{text-align:center}.seal{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;background:#fff2f7;color:#d94d8a;display:grid;place-items:center;font-size:42px}.done-card p{color:#806a74}.summary{display:grid;gap:7px;background:#fff6fa;border:1px solid #f2dae6;border-radius:20px;padding:18px;margin:22px 0}.summary span{display:flex;justify-content:center;gap:7px;align-items:center}@media(max-width:480px){.card{padding:28px}.ask-card h1,.card h2{font-size:30px}.chips{grid-template-columns:repeat(2,1fr)}.phone{min-height:520px}}
</style>
</head>
<body>
<main><div class="blob one"></div><div class="blob two"></div><section class="phone" id="app"></section></main>
<script>
const app=document.getElementById('app');const times=['12:00 PM','1:00 PM','2:00 PM','3:00 PM','4:00 PM','5:00 PM','6:00 PM','6:30 PM','7:00 PM','7:30 PM','8:00 PM','8:30 PM'];const foods=[['🍕','Pizza'],['🍣','Sushi'],['🍔','Burgers'],['🍝','Pasta'],['🌮','Tacos'],['🍜','Ramen']];const months=['January','February','March','April','May','June','July','August','September','October','November','December'];let today=new Date(),step='ask',no={x:0,y:0},month=today.getMonth(),year=today.getFullYear(),day=null,time='',food='';function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}function startDay(y,m){return new Date(y,m,1).getDay()}function render(){if(step==='ask')app.innerHTML=`<div class="card ask-card"><div class="tiny">✨ Important and confidential</div><h1>🌸 Will you go on a<br/>date with me? 🌸</h1><button class="yes" onclick="step='date';render()">YES ❤</button><button id="no" class="no" onclick="moveNo()" onmouseenter="moveNo()" style="transform:translate(${no.x}px,${no.y}px)">NO 🙈</button></div>`;if(step==='date'){let blanks=Array(startDay(year,month)).fill('<button disabled></button>').join('');let days=Array.from({length:daysInMonth(year,month)},(_,i)=>`<button class="${day===i+1?'picked':''}" onclick="day=${i+1};render()">${i+1}</button>`).join('');app.innerHTML=`<div class="card tall"><h2>So... when are you free? 🗓️🐾</h2><label>Pick a day</label><div class="calendar"><div class="cal-head"><button onclick="prevMonth()">‹</button><b>${months[month]} ${year}</b><button onclick="nextMonth()">›</button></div><div class="week">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<span>${d}</span>`).join('')}</div><div class="grid">${blanks}${days}</div></div><label>What time?</label><div class="chips">${times.map(t=>`<button class="${time===t?'picked':''}" onclick="time='${t}';render()">${t}</button>`).join('')}</div><button ${!day||!time?'disabled':''} class="next" onclick="step='food';render()">Set the date ❤️</button></div>`}if(step==='food')app.innerHTML=`<div class="card tall"><h2>What are we feeling? 🍽️</h2><div class="foodgrid">${foods.map(([e,n])=>`<button class="${food===n?'picked':''}" onclick="food='${n}';render()"><span>${e}</span>${n}</button>`).join('')}</div><button ${!food?'disabled':''} class="next" onclick="step='done';render()">Next</button></div>`;if(step==='done')app.innerHTML=`<div class="card done-card"><div class="seal">📅</div><h2>It’s a date! 💖</h2><p>I saved the plan in my heart.</p><div class="summary"><b>${months[month]} ${day}, ${year}</b><span>${time}</span><span>🍽️ ${food}</span></div><button class="next" onclick="step='ask';render()">Start over</button></div>`}function moveNo(){no={x:(Math.random()-.5)*220,y:(Math.random()-.5)*130};render()}function nextMonth(){day=null;if(month===11){month=0;year++}else month++;render()}function prevMonth(){day=null;if(month===0){month=11;year--}else month--;render()}render();
</script>
</body>
</html>
