<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Date Request</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;700;800&display=swap');
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui;color:#4a3440;background:#ffe8f2}body{overflow-x:hidden;overflow-y:auto;background:radial-gradient(circle at 20% 12%,#fff 0,#ffeef7 30%,#f7dbe8 64%,#fff7fb 100%)}main{min-height:100svh;display:flex;justify-content:center;align-items:flex-start;padding:18px 12px 34px;position:relative}.blob{position:fixed;border-radius:999px;filter:blur(24px);opacity:.45;animation:float 7s ease-in-out infinite;pointer-events:none}.one{width:220px;height:220px;background:#f7a8c5;left:-40px;top:90px}.two{width:190px;height:190px;background:#fff;right:-35px;bottom:30px;animation-delay:-3s}@keyframes float{50%{transform:translateY(22px) scale(1.05)}}.phone{width:min(100%,430px);display:block}.card{width:100%;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.9);border-radius:28px;box-shadow:0 24px 60px rgba(169,80,118,.18);padding:30px;text-align:center;position:relative;overflow:visible}.card:before{content:"";position:absolute;inset:0;border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.65),transparent 45%);pointer-events:none}.card>*{position:relative}.tiny{display:inline-flex;gap:8px;align-items:center;color:#b34d79;background:#fff2f7;border:1px solid #ffe0ed;padding:8px 12px;border-radius:99px;font-size:13px;margin-bottom:18px}.ask-card{margin-top:13vh}.ask-card h1,.card h2{font-family:'Playfair Display',serif;color:#b23d68;line-height:1.12;margin:0 0 24px;font-size:34px}.yes,.next{border:0;width:100%;height:58px;border-radius:999px;background:linear-gradient(90deg,#d93078,#d64d8d);color:white;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 15px 28px rgba(214,77,141,.25);cursor:pointer;transition:.2s}.yes:hover,.next:hover{transform:translateY(-2px)}.no{position:absolute;left:62px;bottom:42px;border:0;background:#ffe7f0;color:#8b6374;padding:12px 26px;border-radius:999px;cursor:pointer;transition:transform .25s ease}.tall{text-align:left}.tall h2{text-align:center;font-size:31px;margin-bottom:22px}.tall label{font-size:14px;font-weight:800;margin:15px 0 10px;display:block}.calendar{border:1px solid #efdce5;border-radius:18px;padding:15px;background:rgba(255,255,255,.65)}.cal-head{display:flex;justify-content:space-between;align-items:center;font-size:18px}.cal-head button,.grid button,.chips button,.foodgrid button{border:0;background:transparent;color:#4a3440;cursor:pointer}.cal-head button{width:38px;height:34px;font-size:22px}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}.week{margin:16px 0 7px;color:#7d6872;font-size:13px}.grid button{height:34px;border-radius:999px;font-size:15px;display:grid;place-items:center}.grid button:disabled{opacity:0;pointer-events:none}.grid button:hover,.grid .picked,.chips .picked,.foodgrid .picked{background:#d94d8a!important;color:#fff;box-shadow:0 8px 18px rgba(217,77,138,.25)}.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chips button{background:#fff;border:1px solid #ecd9e1;padding:13px 10px;border-radius:999px;font-weight:800;font-size:15px}.next{margin-top:22px}.next:disabled{background:#eee;color:#aaa;box-shadow:none;cursor:not-allowed}.foodgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.foodgrid button{height:100px;border:1px solid #eedce5;border-radius:20px;background:rgba(255,255,255,.68);font-weight:800;color:#7c6670}.foodgrid span{display:block;font-size:29px;margin-bottom:8px}.done-card{text-align:center;margin-top:13vh}.seal{width:86px;height:86px;margin:0 auto 16px;border-radius:50%;background:#fff2f7;color:#d94d8a;display:grid;place-items:center;font-size:40px}.done-card p{color:#806a74}.summary{display:grid;gap:7px;background:#fff6fa;border:1px solid #f2dae6;border-radius:20px;padding:18px;margin:22px 0}.summary span{display:flex;justify-content:center;gap:7px;align-items:center}@media(max-width:390px){main{padding:12px 8px 28px}.card{padding:22px;border-radius:24px}.card:before{border-radius:24px}.ask-card h1,.card h2{font-size:28px}.tall h2{font-size:27px}.calendar{padding:12px}.week,.grid{gap:4px}.grid button{height:31px;font-size:14px}.chips{gap:8px}.chips button{font-size:14px;padding:12px 6px}.foodgrid{gap:10px}.foodgrid button{height:88px}.yes,.next{height:54px}.ask-card,.done-card{margin-top:9vh}}@media(max-width:340px){.card{padding:18px}.ask-card h1,.card h2{font-size:25px}.cal-head{font-size:16px}.week{font-size:12px}.grid button{height:29px;font-size:13px}.chips button{font-size:13px}.foodgrid button{height:82px}}
</style>
</head>
<body>
<main><div class="blob one"></div><div class="blob two"></div><section class="phone" id="app"></section></main>
<script>
const app=document.getElementById('app');const times=['12:00 PM','1:00 PM','2:00 PM','3:00 PM','4:00 PM','5:00 PM','6:00 PM','6:30 PM','7:00 PM','7:30 PM','8:00 PM','8:30 PM'];const foods=[['🍕','Pizza'],['🍣','Sushi'],['🍔','Burgers'],['🍝','Pasta'],['🌮','Tacos'],['🍜','Ramen']];const months=['January','February','March','April','May','June','July','August','September','October','November','December'];let today=new Date(),step='ask',no={x:0,y:0},month=today.getMonth(),year=today.getFullYear(),day=null,time='',food='';function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}function startDay(y,m){return new Date(y,m,1).getDay()}function render(){window.scrollTo({top:0,behavior:'smooth'});if(step==='ask')app.innerHTML=`<div class="card ask-card"><div class="tiny">✨ Important and confidential</div><h1>🌸 Will you go on a<br/>date with me? 🌸</h1><button class="yes" onclick="step='date';render()">YES ❤</button><button id="no" class="no" onclick="moveNo()" onmouseenter="moveNo()" style="transform:translate(${no.x}px,${no.y}px)">NO 🙈</button></div>`;if(step==='date'){let blanks=Array(startDay(year,month)).fill('<button disabled></button>').join('');let days=Array.from({length:daysInMonth(year,month)},(_,i)=>`<button class="${day===i+1?'picked':''}" onclick="day=${i+1};render()">${i+1}</button>`).join('');app.innerHTML=`<div class="card tall"><h2>So... when are you free? 🗓️🐾</h2><label>Pick a day</label><div class="calendar"><div class="cal-head"><button onclick="prevMonth()">‹</button><b>${months[month]} ${year}</b><button onclick="nextMonth()">›</button></div><div class="week">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<span>${d}</span>`).join('')}</div><div class="grid">${blanks}${days}</div></div><label>What time?</label><div class="chips">${times.map(t=>`<button class="${time===t?'picked':''}" onclick="time='${t}';render()">${t}</button>`).join('')}</div><button ${!day||!time?'disabled':''} class="next" onclick="step='food';render()">Set the date ❤️</button></div>`}if(step==='food')app.innerHTML=`<div class="card tall"><h2>What are we feeling? 🍽️</h2><div class="foodgrid">${foods.map(([e,n])=>`<button class="${food===n?'picked':''}" onclick="food='${n}';render()"><span>${e}</span>${n}</button>`).join('')}</div><button ${!food?'disabled':''} class="next" onclick="step='done';render()">Next</button></div>`;if(step==='done')app.innerHTML=`<div class="card done-card"><div class="seal">📅</div><h2>It’s a date! 💖</h2><p>I saved the plan in my heart.</p><div class="summary"><b>${months[month]} ${day}, ${year}</b><span>${time}</span><span>🍽️ ${food}</span></div><button class="next" onclick="step='ask';render()">Start over</button></div>`}function moveNo(){no={x:(Math.random()-.5)*180,y:(Math.random()-.5)*105};render()}function nextMonth(){day=null;if(month===11){month=0;year++}else month++;render()}function prevMonth(){day=null;if(month===0){month=11;year--}else month--;render()}render();
</script>
</body>
</html>
